[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-iac-generator"
version = "1.0.0"
description = "Resilient Azure IaC and Configuration Generator for multi-tier Terraform and Ansible"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FreeFades2Black", email = "free@local.omarchy" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "jinja2>=3.1.4",
    "typer>=0.12.5",
    "rich>=13.8.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0"
]

[project.scripts]
azure-iac-gen = "app.cli:cli"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
