name: Azure IaC Generator CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite & Validation Pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        run: |
          pytest -v --tb=short

      - name: Verify CLI Generation Execution
        run: |
          python -m app.cli generate \
            --project-name "civalidate" \
            --redundancy "zrs" \
            --primary-region "eastus" \
            --github-user "FreeFades2Black" \
            --github-repo "azure-test-output" \
            --output-dir "./ci-test-output" \
            --no-validate
          
          # Verify expected files exist
          test -f ./ci-test-output/terraform/main.tf
          test -f ./ci-test-output/ansible/playbook_bootstrap.yml
          test -f ./ci-test-output/ansible/files/V1__initial_schema.sql
          
          # Terraform format validation
          terraform -chdir=./ci-test-output/terraform fmt -check
